# Postgres desechable para los tests de integración (pnpm test:integration).
# Los datos viven en memoria (tmpfs): cada `docker compose up` empieza vacío.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier
      POSTGRES_DB: atelier_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier_test"]
      interval: 2s
      timeout: 3s
      retries: 15
